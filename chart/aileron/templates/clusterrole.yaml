apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aileron.fullname" . }}-manager
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
# Cluster-scoped kinds only. Every namespaced permission lives in role.yaml and
# is bound only in the release namespace, so Aileron cannot read or change VMs,
# pods, secrets, or other namespaced objects in any other namespace.
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents, volumesnapshotclasses]
    verbs: [create, delete, get, list, watch]
  # KubeVirt CR (feature gate management). This is the KubeVirt install
  # configuration, not a VM.
  - apiGroups: [kubevirt.io]
    resources: [kubevirts]
    verbs: [get, list, patch, update]
  # Default StorageClass lookup for vmStateStorageClass (persistent vTPM)
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  # KubeOVN VPCs, subnets and IPs are cluster-scoped.
  - apiGroups: [kubeovn.io]
    resources: [vpcs, subnets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [kubeovn.io]
    resources: [ips]
    verbs: [get, list, delete]
  # Metrics endpoint authentication and authorization.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
