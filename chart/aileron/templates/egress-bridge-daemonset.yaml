{{- if .Values.egressExternal.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aileron.fullname" . }}-egress-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aileron.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-bridge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: egress-bridge
  template:
    metadata:
      annotations:
        timestamp: {{ now | quote }}
      labels:
        {{- include "aileron.labels" . | nindent 8 }}
        app.kubernetes.io/component: egress-bridge
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: bridge-setup
          image: "{{ .Values.image.repository }}/egress-bridge:{{ include "aileron.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              BRIDGE="br-egress"
              GATEWAY="{{ .Values.egressExternal.gateway }}"
              CIDR="{{ .Values.egressExternal.cidr }}"
              PREFIX="$(echo "$CIDR" | cut -d/ -f2)"
              VPN_ENABLED="{{ .Values.egressExternal.vpn.enabled }}"
              WG_SRC="/etc/wireguard-src/wg0.conf"
              WG_CONF="/etc/wireguard/wg0.conf"
              WG_TABLE=51820
              WG_PRIORITY=100

              echo "Egress bridge setup starting: bridge=$BRIDGE gateway=$GATEWAY cidr=$CIDR vpn=$VPN_ENABLED"
              while true; do
                if ip link show "$BRIDGE" >/dev/null 2>&1; then
                  if ! ip addr show "$BRIDGE" | grep -q "$GATEWAY"; then
                    ip addr add "${GATEWAY}/${PREFIX}" dev "$BRIDGE" 2>/dev/null || true
                    echo "Assigned $GATEWAY to $BRIDGE"
                  fi

                  echo 1 > /proc/sys/net/ipv4/ip_forward

                  if [ "$VPN_ENABLED" = "true" ]; then
                    # Fail closed: drop the direct-uplink rule first so there is
                    # never a window where VM traffic can leak out the node's
                    # own uplink while the tunnel is (re-)establishing.
                    if iptables -t nat -C POSTROUTING -s "$CIDR" ! -d "$CIDR" -j MASQUERADE 2>/dev/null; then
                      iptables -t nat -D POSTROUTING -s "$CIDR" ! -d "$CIDR" -j MASQUERADE
                      echo "Removed direct-uplink MASQUERADE rule (VPN mode)"
                    fi

                    if [ ! -f "$WG_SRC" ]; then
                      echo "ERROR: $WG_SRC not found (check egressExternal.vpn.secretName) - VM egress has no route"
                      sleep 30
                      continue
                    fi

                    # Derive the active config from the mounted wg-quick file:
                    # force Table=off and drop DNS 
                    grep -viE '^[[:space:]]*(Table|DNS)[[:space:]]*=' "$WG_SRC" \
                      | sed '/^\[Interface\]/a Table = off' > "$WG_CONF"

                    if ip link show wg0 >/dev/null 2>&1; then
                      # Already up: reconcile keys/peer/endpoint in place via
                      # wg-quick's own "strip" (the native wg-quick -> wg(8)
                      # config translator) without bouncing the interface.
                      if ! wg-quick strip "$WG_CONF" 2>/tmp/wg-err | wg syncconf wg0 /dev/stdin 2>>/tmp/wg-err; then
                        echo "ERROR: wg syncconf failed: $(cat /tmp/wg-err) - VM egress may be using a stale config"
                      fi
                    else
                      if ! wg-quick up wg0 2>/tmp/wg-err; then
                        echo "ERROR: wg-quick up failed (kernel WireGuard support missing?): $(cat /tmp/wg-err) - VM egress has no route"
                        sleep 30
                        continue
                      fi
                    fi

                    ip route replace default dev wg0 table $WG_TABLE 2>/dev/null || true

                    if ! ip rule show | grep -q "from $CIDR lookup $WG_TABLE"; then
                      ip rule add from "$CIDR" table $WG_TABLE priority $WG_PRIORITY
                      echo "Added policy rule: from $CIDR lookup table $WG_TABLE"
                    fi

                    if ! iptables -t nat -C POSTROUTING -s "$CIDR" -o wg0 -j MASQUERADE 2>/dev/null; then
                      iptables -t nat -A POSTROUTING -s "$CIDR" -o wg0 -j MASQUERADE
                      echo "Added MASQUERADE rule for $CIDR via wg0"
                    fi

                    if ! iptables -t mangle -C POSTROUTING -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null; then
                      iptables -t mangle -A POSTROUTING -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
                      echo "Added TCP MSS clamp on wg0"
                    fi

                    echo "wg0 handshake: $(wg show wg0 latest-handshakes 2>/dev/null || echo unknown)"
                  else
                    # Direct mode: tear down any VPN-mode state left over from
                    # a prior config before restoring the plain uplink rule.
                    if ip link show wg0 >/dev/null 2>&1; then
                      iptables -t nat -D POSTROUTING -s "$CIDR" -o wg0 -j MASQUERADE 2>/dev/null || true
                      iptables -t mangle -D POSTROUTING -o wg0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
                      ip rule del from "$CIDR" table $WG_TABLE priority $WG_PRIORITY 2>/dev/null || true
                      ip route flush table $WG_TABLE 2>/dev/null || true
                      ip link del wg0 2>/dev/null || true
                      echo "Removed VPN-mode state (direct mode)"
                    fi

                    if ! iptables -t nat -C POSTROUTING -s "$CIDR" ! -d "$CIDR" -j MASQUERADE 2>/dev/null; then
                      iptables -t nat -A POSTROUTING -s "$CIDR" ! -d "$CIDR" -j MASQUERADE
                      echo "Added MASQUERADE rule for $CIDR"
                    fi
                  fi
                else
                  echo "Waiting for $BRIDGE to appear..."
                fi

                sleep 30
              done
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          {{- if .Values.egressExternal.vpn.enabled }}
          volumeMounts:
            - name: wireguard-config
              mountPath: /etc/wireguard-src
              readOnly: true
          {{- end }}
      {{- if .Values.egressExternal.vpn.enabled }}
      volumes:
        - name: wireguard-config
          secret:
            secretName: {{ .Values.egressExternal.vpn.secretName | quote }}
      {{- end }}
{{- end }}
