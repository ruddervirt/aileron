<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aileron-ui</title>
<link rel="stylesheet" href="/style.css">
</head>
<body hx-ext="morph,response-targets">
<header>
  <h1>aileron-ui</h1>
  <span class="sub">VM builds, clones &amp; consoles</span>
</header>

<main>
  <section class="panel">
    <h2>Builds <span id="builds-pager" class="pager-inline"></span></h2>
    <details class="new">
      <summary>New build</summary>
      <form hx-post="/ui/builds" hx-target="#builds" hx-swap="morph:innerHTML" hx-target-error="#build-status"
            hx-on::after-request="document.getElementById('builds').dataset.page='1'">
        <textarea name="manifest" id="build-yaml" spellcheck="false"></textarea>
        <button type="submit">Submit build</button>
      </form>
      <div id="build-status" class="form-status"></div>
    </details>
    <div id="builds" class="list" data-page="1"
         hx-get="/ui/builds" hx-trigger="load, every 4s" hx-vals="js:{page: this.dataset.page}"
         hx-target="this" hx-swap="morph:innerHTML" hx-target-error="this">loading&hellip;</div>
  </section>

  <section class="panel">
    <h2>Clones <span id="clones-pager" class="pager-inline"></span></h2>
    <details class="new">
      <summary>New clone</summary>
      <form hx-post="/ui/clones" hx-target="#clones" hx-swap="morph:innerHTML" hx-target-error="#clone-status"
            hx-on::after-request="document.getElementById('clones').dataset.page='1'">
        <input type="text" name="templateName" placeholder="template (build) name" required>
        <input type="text" name="name" placeholder="clone name" required>
        <button type="submit">Submit clone</button>
      </form>
      <div id="clone-status" class="form-status"></div>
    </details>
    <div id="clones" class="list" data-page="1"
         hx-get="/ui/clones" hx-trigger="load, every 4s" hx-vals="js:{page: this.dataset.page}"
         hx-target="this" hx-swap="morph:innerHTML" hx-target-error="this">loading&hellip;</div>
  </section>

  <section class="panel">
    <h2>Grades</h2>
    <details class="new">
      <summary>New grade</summary>
      <form hx-post="/ui/grades" hx-target="#grades" hx-swap="morph:innerHTML" hx-target-error="#grade-status">
        <textarea name="manifest" id="grade-yaml" spellcheck="false"></textarea>
        <button type="submit">Submit grade</button>
      </form>
      <div id="grade-status" class="form-status"></div>
    </details>
    <div id="grades" class="list"
         hx-get="/ui/grades" hx-trigger="load, every 4s"
         hx-target="this" hx-swap="morph:innerHTML" hx-target-error="this">loading&hellip;</div>
  </section>
</main>

<script>
// Sample manifests pre-filled into the submission textareas.
document.getElementById('build-yaml').value = `apiVersion: ruddervirt.io/v1alpha1
kind: VirtualMachineBuild
metadata:
  name: test-simple
spec:
  vms:
    - name: builder
      source:
        url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
      resources:
        cpu: 1
        memory: "1Gi"
      disks:
        - name: rootdisk
          size: "4Gi"
      communicator:
        sshUsername: debian
      provisioners:
        - name: hello
          type: shell
          shell:
            inline: |
              echo "Hello from aileron!"
              uname -a
  timeout: 60m
`;

document.getElementById('grade-yaml').value = `apiVersion: ruddervirt.io/v1alpha1
kind: GradeRequest
metadata:
  name: grade-sample
spec:
  # Namespace containing the target VMs (e.g. a clone namespace).
  namespace: ns-example
  vms:
    - name: clone-simple-builder
      user: debian
      password: ""
      commands:
        - cat /etc/os-release
        - uname -a
`;
</script>
<script src="/htmx.min.js"></script>
<script src="/idiomorph-ext.min.js"></script>
<script src="/response-targets.min.js"></script>
<script>
// The server never renders <details open> (it doesn't track UI state), so by
// default idiomorph would sync every morphed <details>'s "open" attribute
// back to absent on each poll, snapping open sections shut. Skip morphing
// that one attribute so a locally-expanded <details> (provisioners, "new
// build", etc.) stays however the operator left it across polls/mutations.
Idiomorph.defaults.callbacks.beforeAttributeUpdated = function (attrName, node) {
  return !(attrName === 'open' && node.tagName === 'DETAILS');
};
</script>
</body>
</html>
